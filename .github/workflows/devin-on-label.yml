name: Devin Enablement Trigger

# Public-repo friendly trigger. When a maintainer applies `devin-triage` or
# `devin-remediate` to an issue, this Action forwards the issue context to the
# enablement console backend, which starts the appropriate Devin session.
#
# Required repo secrets:
#   BACKEND_URL    - public URL of the console backend (e.g. https://your-app.fly.dev)
#   BACKEND_SECRET - shared secret matching the backend's BACKEND_SECRET env var
#
# NOTE: Devin's *native* GitHub automations only work on private repositories.
# This Action is the public-repo equivalent: it calls the console backend, which
# in turn calls the Devin REST API.

on:
  issues:
    types: [labeled]

jobs:
  route-label:
    if: >
      github.event.label.name == 'devin-triage' ||
      github.event.label.name == 'devin-remediate'
    runs-on: ubuntu-latest
    steps:
      - name: Forward to enablement console
        env:
          BACKEND_URL: ${{ secrets.BACKEND_URL }}
          BACKEND_SECRET: ${{ secrets.BACKEND_SECRET }}
          LABEL: ${{ github.event.label.name }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: |
          if [ "$LABEL" = "devin-triage" ]; then
            ACTION="triage"
          else
            ACTION="remediate"
          fi

          # Build JSON safely with jq so titles/bodies with quotes don't break it.
          PAYLOAD=$(jq -n \
            --arg action "$ACTION" \
            --argjson issue_number "$ISSUE_NUMBER" \
            --arg title "$ISSUE_TITLE" \
            --arg body "$ISSUE_BODY" \
            '{action: $action, issue_number: $issue_number, title: $title, body: $body}')

          curl -sS -X POST "$BACKEND_URL/api/webhook/github" \
            -H "Authorization: Bearer $BACKEND_SECRET" \
            -H "Content-Type: application/json" \
            -d "$PAYLOAD"
