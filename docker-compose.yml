services:
  backend:
    build: ./backend
    env_file: .env
    volumes:
      - db-data:/app/data
    environment:
      - DB_PATH=/app/data/orchestrator.db
      - GITHUB_REPO=AdityaParashar24/superset
      - POLL_INTERVAL_SECONDS=8
    ports:
      - "8080:8080"

  frontend:
    build: ./frontend
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  db-data:
